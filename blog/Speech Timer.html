<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Timer - William Stella</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <a class="site-name" href="../index.html">William Stella</a>
            <nav class="site-nav" aria-label="Primary">
                <a href="../index.html" class="nav-link">About</a>
                <a href="../projects.html" class="nav-link">Projects</a>
                <a href="../reading-list.html" class="nav-link">Reading List</a>
                <a href="../blog.html" class="nav-link is-current">Blog</a>
                <a href="../contact.html" class="nav-link">Contact</a>
                <button class="theme-toggle" aria-label="Toggle color theme"></button>
            </nav>
        </aside>

        <main class="content">
            <h1 class="page-title">Speech Timer</h1>
            <p class="date">March 1, 2026</p>
            <p>I built a timer designed specifically for judging speech rounds at a speech and debate tournament.</p>
            <p>See it here: <a href="https://wastella.github.io/speechtimer">wastella.github.io/speechtimer</a>.</p>
            <p><a href="../blog.html">Back to blog</a></p>
        </main>
    </div>
    <script>
        (function () {
            var btn = document.querySelector('.theme-toggle');
            function getIsDark() {
                var t = document.documentElement.getAttribute('data-theme');
                if (t === 'dark') return true;
                if (t === 'light') return false;
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            btn.setAttribute('aria-label', getIsDark() ? 'Switch to light mode' : 'Switch to dark mode');
            btn.addEventListener('click', function () {
                var next = getIsDark() ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                btn.setAttribute('aria-label', getIsDark() ? 'Switch to light mode' : 'Switch to dark mode');
            });
        })();
    </script>
</body>
</html>
